spring:
  application:
    name: grpc-verification-client

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

server:
  port: ${SERVER_PORT:8081}

grpc:
  client:
    verification-server:
      host: ${GRPC_CLIENT_VERIFICATION-SERVER_HOST:localhost}
      port: ${GRPC_CLIENT_VERIFICATION-SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always