syntax = "proto3";

option java_package = "edu.rutmiit.demo.grpc";
option java_multiple_files = true;

package userverification;

// =============================================================================
// Сервис верификации пользователей
// =============================================================================

service UserVerification {
  // Верифицирует пользователя при регистрации
  rpc VerifyUser (VerifyUserRequest) returns (VerifyUserResponse);
}

// =============================================================================
// Запрос на верификацию
// =============================================================================

message VerifyUserRequest {
  int64 user_id = 1;              // ID пользователя в системе
  string username = 2;            // Имя пользователя
  string email = 3;               // Email для верификации
  string phone = 4;               // Телефон (опционально)
  string ip_address = 5;          // IP адрес при регистрации
  string user_agent = 6;          // User-Agent браузера
  string registration_date = 7;   // Дата регистрации (ISO-8601)
  string device_fingerprint = 8;  // Отпечаток устройства (опционально)
}

// =============================================================================
// Ответ с результатами верификации
// =============================================================================

message VerifyUserResponse {
  int64 user_id = 1;              // ID пользователя
  bool verified = 2;              // Финальный статус верификации
  VerificationLevel level = 3;    // Уровень верификации
  RiskLevel risk_level = 4;       // Уровень риска
  repeated string flags = 5;      // Флаги (причины отклонения)
  string message = 6;             // Человекочитаемое сообщение
  string recommended_action = 7;  // Рекомендация (ALLOW, BLOCK, MANUAL_CHECK)
  int32 confidence_score = 8;     // Оценка достоверности (0-100)
  VerificationDetails details = 9; // Детали по каждому пункту
}

// =============================================================================
// Перечисления
// =============================================================================

enum VerificationLevel {
  NONE = 0;           // Не верифицирован
  BASIC = 1;          // Базовая верификация (email)
  FULL = 2;           // Полная верификация (email + телефон + документы)
}

enum RiskLevel {
  LOW = 0;            // Низкий риск
  MEDIUM = 1;         // Средний риск
  HIGH = 2;           // Высокий риск
}

// =============================================================================
// Детальная информация по верификации
// =============================================================================

message VerificationDetails {
  EmailVerification email = 1;
  PhoneVerification phone = 2;
  IdentityVerification identity = 3;
  GeoVerification geo = 4;
}

message EmailVerification {
  bool valid = 1;                 // Валидный формат
  bool domain_exists = 2;         // Домен существует
  bool disposable = 3;            // Временный email
  bool suspicious = 4;            // Подозрительный email
  string provider = 5;            // Провайдер (gmail, yandex, etc.)
}

message PhoneVerification {
  bool valid = 1;                 // Валидный формат
  string country_code = 2;        // Код страны
  string carrier = 3;             // Оператор связи
  bool is_mobile = 4;             // Мобильный номер
  bool suspicious = 5;            // Подозрительный номер
}

message IdentityVerification {
  bool username_allowed = 1;      // Имя разрешено
  bool username_suspicious = 2;   // Подозрительное имя
  repeated string blocked_words = 3; // Заблокированные слова в имени
  bool email_verified = 4;        // Email подтвержден
  bool phone_verified = 5;        // Телефон подтвержден
}

message GeoVerification {
  string country = 1;             // Страна по IP
  string city = 2;                // Город по IP
  double latitude = 3;            // Широта
  double longitude = 4;           // Долгота
  bool vpn_detected = 5;          // Использование VPN
  bool proxy_detected = 6;        // Использование прокси
  bool tor_detected = 7;          // Использование Tor
}